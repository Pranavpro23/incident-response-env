[project]
name = "incident-response-env"
version = "0.1.0"
description = "OpenEnv environment for SRE on-call incident response — trains AI agents to triage alerts, diagnose root causes, and remediate production failures"
authors = [
    { name = "Pranav Gadodia" }
]
requires-python = ">=3.10"
dependencies = [
    "openenv-core>=0.2.3",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
